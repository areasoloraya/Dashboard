<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dashboard Area Solo</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1b3a6b">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
html,body{margin:0;height:100%;background:#fff;font-family:sans-serif}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0}
#e{padding:24px;font-size:14px;line-height:1.5}
</style>
</head>
<body>
<script>
// Isi dengan URL Web App Apps Script (berakhiran /exec): Deploy > Kelola deployment > salin "URL aplikasi web".
// Setelah ini semua perubahan tampilan & data cukup dilakukan di Apps Script; file ini tidak perlu diubah lagi.
const APP_URL = 'https://script.google.com/macros/s/AKfycbyAfWHd3hGlK3fTzEn9bMzuZm_WLciY4yU-38DL_Q-jA2iOxoFhHv8d9g-kXl6JKd5mEQ/exec';

if (/^https:\/\/script\.google\.com\/.+\/exec$/.test(APP_URL)) {
  const f = document.createElement('iframe');
  f.src = APP_URL; f.allow = 'fullscreen'; f.title = 'Dashboard';
  document.body.appendChild(f);
} else {
  document.body.innerHTML = '<div id="e"><b>APP_URL belum diisi.</b><br>Buka <code>index.html</code>, isi <code>APP_URL</code> dengan URL Web App Apps Script yang berakhiran <code>/exec</code>.</div>';
}
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
